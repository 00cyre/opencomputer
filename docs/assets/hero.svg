<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">OpenComputer</title><desc id="desc">Let your agent work. Keep your desktop. Open source background computer control for macOS.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d9decf" stroke-width=".6"/></pattern></defs>
<rect width="1280" height="560" rx="28" fill="#f4f3e9"/><rect width="1280" height="560" rx="28" fill="url(#grid)"/>
<rect x="54" y="46" width="171" height="30" rx="15" fill="#dfe6d5"/><text x="70" y="66" fill="#385038" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">YOUR MAC. OPEN.</text>
<text x="54" y="155" fill="#233d2c" font-family="Georgia,serif" font-size="68">OpenComputer</text>
<text x="57" y="228" fill="#233d2c" font-family="Arial,sans-serif" font-size="35" font-weight="700">Let your agent work.</text>
<text x="57" y="273" fill="#233d2c" font-family="Arial,sans-serif" font-size="35" font-weight="700">Keep your desktop.</text>
<text x="58" y="330" fill="#64705d" font-family="Arial,sans-serif" font-size="19">Background app control. A local API.</text>
<text x="58" y="361" fill="#64705d" font-family="Arial,sans-serif" font-size="19">Bring the agent you already use.</text>
<rect x="58" y="427" width="113" height="36" rx="18" fill="#233d2c"/><text x="82" y="450" fill="#f4f3e9" font-family="Arial,sans-serif" font-size="14">macOS 14+</text>
<text x="190" y="450" fill="#4d6549" font-family="Arial,sans-serif" font-size="14">MCP + JavaScript · MIT licensed</text>
<rect x="683" y="113" width="498" height="331" rx="18" fill="#d7ddcf"/><rect x="667" y="96" width="498" height="331" rx="18" fill="#fcfcf7" stroke="#c9d1bd" stroke-width="2"/>
<path d="M667 143H1165" stroke="#d7ddcf"/><circle cx="692" cy="120" r="5" fill="#c5a07a"/><circle cx="710" cy="120" r="5" fill="#d4bd83"/><circle cx="728" cy="120" r="5" fill="#96ab83"/>
<text x="758" y="125" fill="#63715d" font-family="Arial,sans-serif" font-size="13">opencomputer / background session</text>
<text x="700" y="192" fill="#64705d" font-family="monospace" font-size="14">01  observe(app)</text>
<rect x="697" y="214" width="439" height="47" rx="9" fill="#eaf0e2"/><text x="714" y="243" fill="#35513b" font-family="monospace" font-size="16">02  setValue(field, "Hello")</text>
<text x="700" y="298" fill="#64705d" font-family="monospace" font-size="14">03  click(submit)</text>
<text x="700" y="341" fill="#64705d" font-family="monospace" font-size="14">04  verify(result)</text>
<rect x="902" y="384" width="239" height="71" rx="13" fill="#233d2c"/><circle cx="925" cy="420" r="5" fill="#a9c58c"/><text x="941" y="425" fill="#f4f3e9" font-family="Arial,sans-serif" font-size="15">Your focus stays yours.</text>
<text x="58" y="520" fill="#7c8972" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">LOCAL FIRST  /  APP SCOPED  /  OPEN SOURCE</text>
</svg>
