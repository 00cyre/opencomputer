name: Live tests and demo
# Runs the live fixture tests on a macOS runner's desktop session (which has Accessibility
# and Screen Recording) and records `npm run demo` as a video, kept as a build artifact
# with the test output. Runs on native, server, and fixture changes, or by hand.
on:
  push:
    paths:
      - 'native/**'
      - 'src/**'
      - 'tests/perception.mjs'
      - 'tests/integration.mjs'
      - 'tests/fixture.swift'
      - 'scripts/demo.mjs'
      - 'scripts/build*.sh'
      - '.github/workflows/live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run fixture:build
      - name: Permissions on this runner
        run: node bin/opencomputer.mjs doctor
      - name: Live reading and checking features (test:perception)
        run: npm run test:perception
      - name: Live integration (test:integration)
        if: always()
        run: npm run test:integration
      - name: Record the demo
        if: always()
        run: |
          mkdir -p work/demo
          : > work/demo/demo.txt
          # A Terminal window shows the narration; the demo itself runs from this shell.
          osascript -e "tell application \"Terminal\" to do script \"clear; tail -n +1 -f '$PWD/work/demo/demo.txt'\"" \
            -e 'tell application "Terminal" to set bounds of front window to {0, 25, 1000, 760}' \
            -e 'tell application "Terminal" to activate' || true
          sleep 3
          screencapture -v -V 150 -x work/demo/demo.mov &
          RECORDER=$!
          sleep 2
          STATUS=0
          DEMO_PACE_MS=2200 npm run demo >> work/demo/demo.txt 2>&1 || STATUS=$?
          sleep 3
          kill -INT $RECORDER 2>/dev/null || true
          wait $RECORDER || true
          cat work/demo/demo.txt
          if command -v avconvert >/dev/null && [ -s work/demo/demo.mov ]; then
            avconvert --preset Preset1920x1080 --source work/demo/demo.mov --output work/demo/opencomputer-demo.mp4 || true
          fi
          ls -la work/demo
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencomputer-demo
          path: work/demo
          if-no-files-found: warn
