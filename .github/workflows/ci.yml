name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
  native:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
        env:
          OPENCOMPUTER_ARCH: ${{ matrix.arch }}
      - run: codesign --verify --strict build/opencomputer-native
      - run: npm run test:motion
        if: matrix.arch == 'arm64'
      - run: npm run test:interaction
        if: matrix.arch == 'arm64'
      - run: npm run test:approval
        if: matrix.arch == 'arm64'
      - run: npm run fixture:build
