name: Overlay screenshots
# Runs the live overlay UI test on a macOS runner's desktop session and keeps
# the captured PNGs (dark and light) as a build artifact for reviews and docs.
# Run it by hand with "commit" ticked to refresh the dark screenshots in
# docs/assets on that branch.
on:
  push:
    paths:
      - 'native/**'
      - 'tests/overlay-ui.swift'
      - 'scripts/test-ui.sh'
      - 'scripts/build-fixture.sh'
      - 'tests/fixture.swift'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the dark screenshots to docs/assets on this branch
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run fixture:build
      - name: Dark appearance
        run: bash scripts/test-ui.sh
        env:
          OPENCOMPUTER_UI_APPEARANCE: dark
          OPENCOMPUTER_UI_OUTPUT: work/overlay-ui/dark
      - name: Light appearance
        if: always()
        run: bash scripts/test-ui.sh
        env:
          OPENCOMPUTER_UI_APPEARANCE: light
          OPENCOMPUTER_UI_OUTPUT: work/overlay-ui/light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-screenshots
          path: work/overlay-ui/**/*.png
          if-no-files-found: warn
  commit:
    needs: capture
    if: github.event_name == 'workflow_dispatch' && inputs.commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: overlay-screenshots
          path: work/overlay-ui
      - name: Commit refreshed screenshots
        run: |
          for name in activity-collapsed activity-expanded activity-paused activity-approval ghost-cursor ghost-cursor-hand ghost-cursor-text; do
            cp "work/overlay-ui/dark/$name.png" "docs/assets/$name.png"
          done
          git add docs/assets/*.png
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git -c user.name="${{ github.actor }}" -c user.email="${{ github.actor }}@users.noreply.github.com" \
            commit -m "Refresh overlay screenshots from the macOS UI test"
          git push origin "HEAD:${{ github.ref_name }}"
